{% extends "base.html" %}

{% block title %}Merchant Inbox | DataExpress{% endblock %}

{% block content %}
<!-- BRIDGE SCRIPT: Connects Flask/Jinja variables to JavaScript -->
<script>
    var __firebase_config = '{{ __firebase_config | safe if __firebase_config else "{}" }}';
    var __app_id = '{{ __app_id if __app_id else "ledgehold-ghana1" }}';
</script>

<div class="container py-4" style="min-height: 70vh;">
    <!-- SESSION LOADING STATE -->
    <div id="loadingView" class="text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-3 text-muted small">Verifying Secure Session...</p>
    </div>

    <!-- MAIN INBOX VIEW -->
    <div id="inboxView" class="d-none">
        <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
            <div>
                <a href="/merchant_dashboard" class="text-decoration-none small fw-bold text-primary mb-2 d-inline-block">
                    <i class="bi bi-arrow-left me-1"></i> Dashboard
                </a>
                <h4 class="fw-bold mb-0 text-dark"><i class="bi bi-chat-right-dots-fill me-2 text-primary"></i>Inbox</h4>
                <p class="text-muted small mb-0">Merchant: <span id="activeMerchantDisplay" class="fw-bold text-primary"></span></p>
            </div>
            <div class="text-end">
                <span class="badge bg-primary-subtle text-primary rounded-pill mb-2 px-3 border border-primary border-opacity-10">
                    <i class="bi bi-shield-check me-1"></i> SECURE NODE
                </span>
            </div>
        </div>
        
        <div id="inboxList" class="row g-3">
            <!-- Shimmer/Loading state -->
            <div class="text-center py-5">
                <div class="spinner-border text-primary spinner-border-sm" role="status"></div>
                <p class="mt-2 text-muted small">Loading active deals...</p>
            </div>
        </div>
    </div>
</div>

<!-- RENAME MODAL -->
<div class="modal fade" id="renameModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content border-0 shadow-lg rounded-4">
            <div class="modal-header border-0 pb-0">
                <h6 class="modal-title fw-bold">Identify Buyer</h6>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p class="x-small text-muted mb-3">Set a custom name for this specific negotiation.</p>
                <input type="text" id="customNameInput" class="form-control rounded-pill border-light bg-light py-2 px-3 mb-3" placeholder="e.g. Bulk Order - Isaac">
                <button id="saveRenameBtn" class="btn btn-primary w-100 rounded-pill fw-bold">Save Identifier</button>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";
    import { getFirestore, collection, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";

    // 1. Initialize Firebase
    let app, auth, db, appId;
    try {
        const config = JSON.parse(__firebase_config);
        app = initializeApp(config);
        auth = getAuth(app);
        db = getFirestore(app);
        appId = __app_id;
    } catch (e) {
        console.error("Inbox Init Error:", e);
    }

    const currentMerchant = localStorage.getItem('ledgehold_merchant_name');
    let unsubscribe = null;
    let activeRenameId = null;

    /**
     * TIMING LOGIC: Relative Time Formatter
     */
    function formatRelativeTime(date) {
        if (!date) return "Pending";
        
        const now = new Date();
        const diffInSeconds = Math.floor((now - date) / 1000);
        const diffInMinutes = Math.floor(diffInSeconds / 60);
        const diffInHours = Math.floor(diffInMinutes / 60);
        
        // Today logic
        if (diffInSeconds < 60) return "Just now";
        if (diffInMinutes < 60) return `${diffInMinutes}m ago`;
        if (diffInHours < 24) {
            if (now.getDate() === date.getDate()) {
                return `${diffInHours}h ago`;
            }
        }
        
        // Yesterday logic
        const yesterday = new Date();
        yesterday.setDate(now.getDate() - 1);
        if (yesterday.getDate() === date.getDate() && 
            yesterday.getMonth() === date.getMonth() && 
            yesterday.getFullYear() === date.getFullYear()) {
            return "Yesterday";
        }
        
        // Older messages
        return date.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
    }

    function checkSession() {
        if (!currentMerchant) {
            window.location.href = '/merchant_dashboard';
            return;
        }
        
        document.getElementById('loadingView').classList.add('d-none');
        document.getElementById('inboxView').classList.remove('d-none');
        document.getElementById('activeMerchantDisplay').innerText = currentMerchant;
        initInboxListener();
    }

    function initInboxListener() {
        if (unsubscribe) unsubscribe();
        if (!db) return;

        const navRef = collection(db, 'artifacts', appId, 'public', 'data', 'active_negotiations');
        
        unsubscribe = onSnapshot(navRef, (snapshot) => {
            const container = document.getElementById('inboxList');
            let html = '';
            
            const activeDocs = [];
            snapshot.forEach(docSnap => {
                const data = docSnap.data();
                if (data.seller === currentMerchant) {
                    activeDocs.push({ id: docSnap.id, ...data });
                }
            });
            
            /**
             * AUTO FILTER: Newest messages first
             * Architecture Note: We use 'lastMessageAt' for sorting. 
             * This field should only be updated when a message is actually sent.
             */
            activeDocs.sort((a, b) => {
                const timeA = a.lastMessageAt?.toMillis() || a.lastUpdate?.toMillis() || 0;
                const timeB = b.lastMessageAt?.toMillis() || b.lastUpdate?.toMillis() || 0;
                return timeB - timeA;
            });
            
            activeDocs.forEach(data => {
                // Prioritize lastMessageAt, fallback to lastUpdate if no messages sent yet
                const date = data.lastMessageAt?.toDate() || data.lastUpdate?.toDate();
                const relativeTime = formatRelativeTime(date);
                const displayTitle = data.customDisplayName || data.item;
                const isRenamed = !!data.customDisplayName;

                html += `
                    <div class="col-md-6 col-lg-4">
                        <div class="card border-0 shadow-sm rounded-4 p-4 h-100 vault-card position-relative">
                            <div class="mb-3">
                                <div class="d-flex justify-content-between align-items-start gap-2">
                                    <div class="flex-grow-1 overflow-hidden">
                                        <div class="d-flex align-items-center gap-2 mb-1">
                                            <h6 class="fw-bold mb-0 text-dark text-truncate">${displayTitle}</h6>
                                            <button onclick="openRenameModal('${data.id}', '${displayTitle}')" class="btn btn-link p-0 text-primary" style="font-size: 0.8rem;">
                                                <i class="bi bi-pencil-square"></i>
                                            </button>
                                        </div>
                                        ${isRenamed ? `<p class="x-small text-muted mb-0 text-truncate">Item: ${data.item}</p>` : ''}
                                    </div>
                                    <div class="text-end flex-shrink-0">
                                        <span class="badge bg-light text-dark rounded-pill fw-bold border" style="font-size: 0.6rem;">
                                            ${relativeTime}
                                        </span>
                                    </div>
                                </div>
                                <div class="mt-3 pt-2 border-top border-light">
                                    <div class="d-flex justify-content-between align-items-center">
                                        <small class="text-muted" style="font-size: 0.6rem; letter-spacing: 0.5px;">SECURE ID: ${data.buyerId.split('-')[0].substring(0,8)}</small>
                                        <i class="bi bi-shield-lock text-success" style="font-size: 0.7rem;"></i>
                                    </div>
                                </div>
                            </div>
                            <div class="d-grid mt-auto">
                                <a href="/chat?seller=${encodeURIComponent(data.seller)}&item=${encodeURIComponent(data.item)}&vault_id=${data.buyerId}" class="btn btn-dark rounded-pill fw-bold btn-sm py-2 shadow-sm">
                                    Continue Negotiation <i class="bi bi-arrow-right-short ms-1"></i>
                                </a>
                            </div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html || `
                <div class="text-center py-5 w-100">
                    <div class="bg-light rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 80px; height: 80px;">
                        <i class="bi bi-inbox text-muted fs-1"></i>
                    </div>
                    <p class="mt-2 text-muted fw-bold">Your Negotiation Inbox is Empty</p>
                    <p class="x-small text-muted">Customer deals will appear here once logs are initiated.</p>
                </div>
            `;
        }, (error) => {
            console.error("Inbox Sync Error:", error);
        });
    }

    // Rename Logic: Renaming does NOT trigger a 'lastMessageAt' update, so cards stay in order
    window.openRenameModal = (docId, currentName) => {
        activeRenameId = docId;
        document.getElementById('customNameInput').value = currentName;
        new bootstrap.Modal(document.getElementById('renameModal')).show();
    };

    document.getElementById('saveRenameBtn').onclick = async () => {
        const newName = document.getElementById('customNameInput').value.trim();
        if (!newName || !activeRenameId) return;

        const btn = document.getElementById('saveRenameBtn');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Updating...';

        try {
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'active_negotiations', activeRenameId);
            await updateDoc(docRef, { customDisplayName: newName });
            bootstrap.Modal.getInstance(document.getElementById('renameModal')).hide();
        } catch (e) {
            console.error("Rename failed:", e);
            alert("Update failed.");
        } finally {
            btn.disabled = false;
            btn.innerHTML = 'Save Identifier';
        }
    };

    onAuthStateChanged(auth, (user) => {
        if (user) checkSession();
        else signInAnonymously(auth).catch(err => console.error("Anonymous Auth Failed", err));
    });
</script>

<style>
    body { background-color: #f8fafc; }
    .bg-primary-subtle { background-color: #e0e7ff !important; }
    .vault-card { 
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
        border-left: 5px solid #0d6efd !important; 
        background: #fff;
    }
    .vault-card:hover { 
        transform: translateY(-4px); 
        box-shadow: 0 15px 30px -10px rgba(0, 0, 0, 0.1) !important; 
    }
    .x-small { font-size: 0.65rem; }
    .form-control:focus { border-color: #0d6efd; box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.1); }
</style>
{% endblock %}
