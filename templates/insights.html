{% extends "base.html" %}

{% block title %}Merchant Channel | ProlyfiQ{% endblock %}

{% block content %}
<script>
    var __firebase_config = '{{ __firebase_config | safe if __firebase_config else "{}" }}';
    var __app_id = '{{ __app_id if __app_id else "ledgehold-ghana1" }}';
</script>

<div class="mb-4">
    <a href="/merchant_dashboard" 
      style="display: inline-flex; align-items: center; gap: 12px; padding: 8px 4px; font-size: 0.875rem; font-weight: bold; color: #64748b; text-decoration: none; transition: all 0.3s ease;"
      class="hover:text-slate-900"
    >
      <div style="display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 50%; background-color: #f1f5f9;">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <path d="m15 18-6-6 6-6"/>
        </svg>
      </div>
      <span>Dashboard</span>
    </a>
</div>

<div class="container py-2" style="min-height: 80vh; max-width: 600px;">
    <div id="loadingView" class="text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-3 text-muted small">Loading...</p>
    </div>

    <div id="insightsSection" class="d-none pb-5">
        
        <div class="text-center mb-5">
            <h3 class="fw-bold text-dark">Merchant Channel</h3>
            <p class="text-muted small" id="syncText">Official broadcast feed for Merchants on ProlyfiQ.</p>
            
            <div class="merchant-badge-animation-wrapper" style="position: relative; height: 70px; margin-top: 10px;">
                <div id="merchantBadge" class="merchant-badge-animating" style="position: absolute; top: -40px; left: 50%; transform: translateX(-50%); width: 35px; height: 35px; border-radius: 50%; background-color: #0d6efd; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1); z-index: 20;">
                    <i class="bi bi-shield-fill-check text-white"></i>
                </div>
            </div>
        </div>

        <div id="channelFeed" class="d-flex flex-column gap-4">
            </div>

        <div class="text-center py-5 mt-4 opacity-50">
            <i class="bi bi-check2-circle fs-3 text-muted"></i>
        </div>
    </div>
</div>

<div class="modal fade" id="imageModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content bg-transparent border-0">
            <div class="text-end mb-2">
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <img id="lightboxImg" src="" class="img-fluid rounded-4 shadow-lg mx-auto d-block">
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";
    import { getFirestore, collection, doc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";

    const config = JSON.parse(__firebase_config);
    const app = initializeApp(config);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const appId = __app_id;

    let currentMerchant = localStorage.getItem('ledgehold_merchant_name');
    let merchantUniversity = "Verified Merchant"; // Fallback text
    let feedUnsubscribe = null;

    /**
     * FETCH MERCHANT PROFILE & ANIMATE BADGE
     */
    async function initMerchantProfile() {
        if (!currentMerchant) return;
        
        try {
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'verified_merchants', currentMerchant);
            const docSnap = await getDoc(docRef);
            
            if (docSnap.exists()) {
                merchantUniversity = docSnap.data().university || "Verified Merchant";
            }
            
            // Start badge animation
            setTimeout(() => {
                animateMerchantBadge(currentMerchant, merchantUniversity);
            }, 300);

        } catch (error) {
            console.error("Failed to fetch merchant details:", error);
            animateMerchantBadge(currentMerchant, "Verified Merchant");
        }
    }

    /**
     * STANDARDIZED MERCHANT BADGE ANIMATION
     */
    function animateMerchantBadge(name, campus) {
        const badge = document.getElementById('merchantBadge');
        const syncText = document.getElementById('syncText');
        if (!badge) return;
        
        if (syncText) syncText.classList.add('sync-text-fade');
        
        setTimeout(() => {
            badge.style.transition = 'all 0.3s cubic-bezier(0.68, -0.55, 0.27, 1.55)';
            badge.style.top = '0';
            
            setTimeout(() => {
                badge.style.transition = 'all 0.15s ease-out';
                badge.style.top = '-5px';
                
                setTimeout(() => {
                    badge.style.transition = 'all 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55)';
                    badge.style.top = '0';
                    badge.style.width = 'auto';
                    badge.style.height = 'auto';
                    badge.style.padding = '8px 16px 8px 8px';
                    badge.style.borderRadius = '50px';
                    badge.style.backgroundColor = '#fff';
                    badge.style.border = '1px solid #e2e8f0';
                    badge.style.boxShadow = '0 4px 12px rgba(0, 0, 0, 0.1)';
                    badge.style.display = 'flex';
                    badge.style.alignItems = 'center';
                    badge.style.gap = '12px';
                    
                    const textContainer = document.createElement('div');
                    textContainer.className = 'text-start';
                    textContainer.innerHTML = `
                        <p class="mb-0 fw-bold text-dark x-small">${name}</p>
                        <p class="mb-0 text-muted" style="font-size: 0.6rem;">${campus}</p>
                    `;
                    
                    setTimeout(() => {
                        textContainer.style.opacity = '0';
                        textContainer.style.transform = 'translateX(-10px)';
                        textContainer.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
                        badge.appendChild(textContainer);
                        
                        setTimeout(() => {
                            textContainer.style.opacity = '1';
                            textContainer.style.transform = 'translateX(0)';
                            if (syncText) syncText.classList.remove('sync-text-fade');
                        }, 50);
                    }, 200);
                }, 150);
            }, 300);
        }, 100);
    }

    function startIntelligenceFeed() {
        if (feedUnsubscribe) feedUnsubscribe();
        
        const channelRef = collection(db, 'artifacts', appId, 'public', 'data', 'intelligence_channel');

        feedUnsubscribe = onSnapshot(channelRef, (snapshot) => {
            const container = document.getElementById('channelFeed');
            const docs = [];
            snapshot.forEach(d => {
                const data = d.data();
                docs.push(data);
            });
            
            // Sort newest first
            docs.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

            container.innerHTML = docs.map(update => `
                <div class="card border-0 shadow-sm rounded-4 overflow-hidden animate-slide-up bg-white">
                    ${update.imgUrl ? `
                        <div class="bg-light border-bottom" style="cursor: zoom-in; max-height: 400px; overflow: hidden;" onclick="viewImage('${update.imgUrl}')">
                            <img src="${update.imgUrl}" class="w-100 h-auto" style="object-fit: cover; min-height: 200px;" alt="Command Briefing">
                        </div>
                    ` : ''}
                    <div class="card-body p-4">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <h6 class="fw-bold text-dark mb-0 pe-3">${update.header}</h6>
                            <span class="badge bg-light text-muted fw-bold rounded-pill" style="font-size: 0.55rem;">
                                ${formatDate(update.timestamp)}
                            </span>
                        </div>
                        <p class="small text-muted mb-0" style="line-height: 1.6; white-space: pre-wrap;">${update.message}</p>
                    </div>
                </div>
            `).join('');

            if (docs.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-5">
                        <i class="bi bi-chat-dots text-muted opacity-25" style="font-size: 4rem;"></i>
                        <p class="text-muted small mt-3">No new update.</p>
                    </div>
                `;
            }
        });
    }

    window.viewImage = (url) => {
        document.getElementById('lightboxImg').src = url;
        new bootstrap.Modal(document.getElementById('imageModal')).show();
    };

    /**
     * DYNAMIC TIME-SENSITIVE FORMATTING
     */
    function formatDate(ts) {
        if (!ts) return "Just now";
        const date = new Date(ts);
        const now = new Date();
        const diffMs = now - date;
        const diffMins = Math.floor(diffMs / 60000);
        const diffHours = Math.floor(diffMs / 3600000);

        if (diffMins < 1) return "Just now";
        if (diffMins < 60) return `${diffMins} ${diffMins === 1 ? 'm' : 'm'} ago`;
        if (diffHours < 24) return `${diffHours} ${diffHours === 1 ? 'h' : 'h'} ago`;

        const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const yesterday = new Date(today);
        yesterday.setDate(yesterday.getDate() - 1);
        const itemDate = new Date(date.getFullYear(), date.getMonth(), date.getDate());

        if (itemDate.getTime() === yesterday.getTime()) {
            return "Yesterday";
        } else {
            return date.toLocaleDateString([], { day: '2-digit', month: 'short' });
        }
    }

    const SESSION_TIMEOUT = 240000;
    function handleLogout() {
        localStorage.removeItem('ledgehold_merchant_name');
        localStorage.removeItem('ledgehold_last_active');
        window.location.href = '/merchant_dashboard'; 
    }

    function refreshUI() {
        const last = localStorage.getItem('ledgehold_last_active');
        const now = Date.now();
        if (last && (now - last > SESSION_TIMEOUT)) { handleLogout(); return; }

        document.getElementById('loadingView').classList.add('d-none');
        if (currentMerchant) {
            document.getElementById('insightsSection').classList.remove('d-none');
            initMerchantProfile();
            startIntelligenceFeed();
            localStorage.setItem('ledgehold_last_active', now);
        } else {
            window.location.href = '/merchant_dashboard';
        }
    }

    onAuthStateChanged(auth, (user) => { 
        if (user) refreshUI(); 
        else signInAnonymously(auth); 
    });
</script>

<style>
    body { background-color: #f8fafc; }
    .animate-slide-up { animation: slideUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .x-small { font-size: 0.65rem; }
    
    /* Merchant Badge Styles */
    .merchant-badge-animation-wrapper {
        min-height: 70px;
        overflow: visible !important;
        margin-bottom: 10px;
    }
    .sync-text-fade { animation: syncTextFade 1.2s ease-in-out; }
    @keyframes syncTextFade {
        0%, 40% { opacity: 1; }
        50% { opacity: 0.3; transform: translateY(-2px); }
        60%, 100% { opacity: 1; transform: translateY(0); }
    }
</style>
{% endblock %}
