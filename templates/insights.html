{% extends "base.html" %}

{% block title %}Merchant Channel | ProlyfiQ{% endblock %}

{% block content %}
<!-- BRIDGE SCRIPT: Connects Flask/Jinja variables to JavaScript -->
<script>
    var __firebase_config = '{{ __firebase_config | safe if __firebase_config else "{}" }}';
    var __app_id = '{{ __app_id if __app_id else "ledgehold-ghana1" }}';
</script>

<div class="container py-4" style="min-height: 80vh; max-width: 600px;">
    <!-- INITIAL LOADING STATE -->
    <div id="loadingView" class="text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-3 text-muted small">Loading...</p>
    </div>

    <!-- INTELLIGENCE CHANNEL (AUTHENTICATED) -->
    <div id="insightsSection" class="d-none pb-5">
        <div class="d-flex justify-content-between align-items-center mb-4 sticky-top bg-light py-3 border-bottom" style="z-index: 100;">
            <div>
                <a href="/merchant_dashboard" class="text-decoration-none small fw-bold text-muted d-inline-flex align-items-center gap-2">
                    <i class="bi bi-arrow-left"></i> Dashboard
                </a>
                <h4 class="fw-bold mb-0 text-dark">Campus Intel</h4>
                <div class="d-flex align-items-center gap-2">
                    <span class="bg-success rounded-circle animate-pulse" style="width: 8px; height: 8px;"></span>
                    <p class="text-muted small mb-0">Merchant: <span id="activeMerchantDisplay" class="fw-bold text-primary" style="text-transform: capitalize;"></span></p>
                </div>
            </div>
            <div class="bg-white rounded-pill px-3 py-1 border shadow-sm d-flex align-items-center gap-2">
                <i class="bi bi-shield-fill-check text-success"></i>
                <span class="fw-bold x-small text-uppercase">Merchant Hub</span>
            </div>
        </div>

        <!-- CHANNEL FEED CONTAINER -->
        <div id="channelFeed" class="d-flex flex-column gap-4">
            <!-- Messages injected via Firestore listener -->
        </div>

        <!-- END OF FEED MARKER -->
        <div class="text-center py-5 mt-4 opacity-50">
            <i class="bi bi-check2-circle fs-3 text-muted"></i>
        </div>
    </div>
</div>

<!-- IMAGE LIGHTBOX -->
<div class="modal fade" id="imageModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content bg-transparent border-0">
            <div class="text-end mb-2">
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <img id="lightboxImg" src="" class="img-fluid rounded-4 shadow-lg mx-auto d-block">
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";
    import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";

    const config = JSON.parse(__firebase_config);
    const app = initializeApp(config);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const appId = __app_id;

    let currentMerchant = localStorage.getItem('ledgehold_merchant_name');
    let feedUnsubscribe = null;

    function startIntelligenceFeed() {
        if (feedUnsubscribe) feedUnsubscribe();
        
        const channelRef = collection(db, 'artifacts', appId, 'public', 'data', 'intelligence_channel');

        feedUnsubscribe = onSnapshot(channelRef, (snapshot) => {
            const container = document.getElementById('channelFeed');
            const docs = [];
            snapshot.forEach(d => {
                const data = d.data();
                docs.push(data);
            });
            
            // Sort newest first
            docs.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

            container.innerHTML = docs.map(update => `
                <div class="card border-0 shadow-sm rounded-4 overflow-hidden animate-slide-up bg-white">
                    ${update.imageUrl ? `
                        <div class="bg-light border-bottom" style="cursor: zoom-in; max-height: 400px; overflow: hidden;" onclick="viewImage('${update.imageUrl}')">
                            <img src="${update.imageUrl}" class="w-100 h-auto" style="object-fit: cover; min-height: 200px;" alt="Command Briefing">
                        </div>
                    ` : ''}
                    <div class="card-body p-4">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <h6 class="fw-bold text-dark mb-0 pe-3">${update.header}</h6>
                            <span class="badge bg-light text-muted fw-bold rounded-pill" style="font-size: 0.55rem;">
                                ${formatDate(update.timestamp)}
                            </span>
                        </div>
                        <p class="small text-muted mb-0" style="line-height: 1.6; white-space: pre-wrap;">${update.message}</p>
                        
                        ${update.actionLabel ? `
                            <div class="mt-3 pt-3 border-top border-light">
                                <a href="${update.actionUrl || '#'}" class="btn btn-primary btn-sm rounded-pill fw-bold px-3">
                                    ${update.actionLabel} <i class="bi bi-arrow-right-short ms-1"></i>
                                </a>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `).join('');

            if (docs.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-5">
                        <i class="bi bi-chat-dots text-muted opacity-25" style="font-size: 4rem;"></i>
                        <p class="text-muted small mt-3">No new update.</p>
                    </div>
                `;
            }
        });
    }

    window.viewImage = (url) => {
        document.getElementById('lightboxImg').src = url;
        new bootstrap.Modal(document.getElementById('imageModal')).show();
    };

    /**
     * DYNAMIC TIME-SENSITIVE FORMATTING
     * Shows minutes, hours, "Yesterday", or the specific date.
     */
    function formatDate(ts) {
        if (!ts) return "Just now";
        const date = new Date(ts);
        const now = new Date();
        const diffMs = now - date;
        const diffMins = Math.floor(diffMs / 60000);
        const diffHours = Math.floor(diffMs / 3600000);

        // 1. Minute handling (less than 60 mins)
        if (diffMins < 1) return "Just now";
        if (diffMins < 60) return `${diffMins} ${diffMins === 1 ? 'minute' : 'minutes'} ago`;

        // 2. Hour handling (less than 24 hours)
        if (diffHours < 24) return `${diffHours} ${diffHours === 1 ? 'hour' : 'hours'} ago`;

        // 3. Calendar Day handling (Yesterday and older)
        const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const yesterday = new Date(today);
        yesterday.setDate(yesterday.getDate() - 1);
        const itemDate = new Date(date.getFullYear(), date.getMonth(), date.getDate());

        if (itemDate.getTime() === yesterday.getTime()) {
            return "Yesterday";
        } else {
            return date.toLocaleDateString([], { day: '2-digit', month: 'short' });
        }
    }

    const SESSION_TIMEOUT = 120000;
    function handleLogout() {
        localStorage.removeItem('ledgehold_merchant_name');
        localStorage.removeItem('ledgehold_last_active');
        window.location.href = '/merchant_dashboard'; 
    }

    function refreshUI() {
        const last = localStorage.getItem('ledgehold_last_active');
        const now = Date.now();
        if (last && (now - last > SESSION_TIMEOUT)) { handleLogout(); return; }

        document.getElementById('loadingView').classList.add('d-none');
        if (currentMerchant) {
            document.getElementById('insightsSection').classList.remove('d-none');
            document.getElementById('activeMerchantDisplay').innerText = currentMerchant;
            startIntelligenceFeed();
            localStorage.setItem('ledgehold_last_active', now);
        } else {
            window.location.href = '/merchant_dashboard';
        }
    }

    onAuthStateChanged(auth, (user) => { 
        if (user) refreshUI(); 
        else signInAnonymously(auth); 
    });
</script>

<style>
    body { background-color: #f1f5f9; }
    .animate-slide-up { animation: slideUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .x-small { font-size: 0.65rem; }
    .animate-pulse { animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .btn-primary { background-color: #0f172a; border: none; }
    .btn-primary:hover { background-color: #1e293b; }
</style>
{% endblock %}
