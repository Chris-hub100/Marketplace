<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | ProlyfiQ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .error-shell {
            width: 100%;
            max-width: 440px;
            text-align: center;
        }

        /* ── 404 Number ── */
        .error-number {
            font-size: clamp(4rem, 10vw, 6rem);
            font-weight: 900;
            color: #e2e8f0;
            letter-spacing: -0.04em;
            line-height: 1;
            margin-bottom: 8px;
        }

        /* ── Headline ── */
        .error-headline h1 {
            font-size: 1.4rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 8px;
        }

        .error-headline p {
            font-size: 0.88rem;
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        /* ── Hint Card ── */
        .hint-card {
            background: #fff;
            border: 1px solid #e8eaf0;
            border-radius: 14px;
            padding: 20px 22px;
            text-align: left;
            margin-bottom: 28px;
        }

        .hint-card p {
            font-size: 0.68rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #94a3b8;
            margin-bottom: 12px;
        }

        .hint-card ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .hint-card li {
            font-size: 0.82rem;
            color: #64748b;
            padding: 6px 0 6px 20px;
            position: relative;
            line-height: 1.5;
        }

        .hint-card li::before {
            content: '';
            position: absolute;
            left: 4px;
            top: 14px;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #cbd5e1;
        }

        /* ── Actions ── */
        .actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-primary-action {
            display: block;
            width: 100%;
            padding: 14px;
            background: #0f172a;
            color: #fff;
            border: none;
            border-radius: 100px;
            font-size: 0.9rem;
            font-weight: 700;
            text-decoration: none;
            text-align: center;
            transition: background 0.2s, transform 0.15s;
        }

        .btn-primary-action:hover {
            background: #1e293b;
            color: #fff;
            transform: translateY(-1px);
        }

        .btn-outline-action {
            display: block;
            width: 100%;
            padding: 13px;
            background: transparent;
            color: #64748b;
            border: 1.5px solid #e2e8f0;
            border-radius: 100px;
            font-size: 0.88rem;
            font-weight: 600;
            text-decoration: none;
            text-align: center;
            transition: border-color 0.2s, color 0.2s;
        }

        .btn-outline-action:hover {
            border-color: #0f172a;
            color: #0f172a;
        }
    </style>
</head>
<body>
    <div class="error-shell">
        
        <!-- 404 Number -->
        <div class="error-number">404</div>

        <!-- Headline -->
        <div class="error-headline">
            <h1>Page Not Found</h1>
            <p>The page you're looking for doesn't exist or may have been moved to a different address.</p>
        </div>

        <!-- Hint Card -->
        <div class="hint-card">
            <p>You might have</p>
            <ul>
                <li>Typed the address incorrectly</li>
                <li>Followed an expired or broken link</li>
                <li>Tried to access a page that no longer exists</li>
            </ul>
        </div>

        <!-- Actions -->
        <div class="actions">
            <a href="/" class="btn-primary-action">
                <i class="bi bi-house-door-fill me-2"></i>Go Home
            </a>
        </div>

    </div>
</body>
</html>
