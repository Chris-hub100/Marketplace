{% extends "base.html" %}

{% block content %}

<div class="mb-6">
  <a href="javascript:history.back()" 
    style="display: inline-flex; align-items: center; gap: 12px; padding: 8px 4px; font-size: 0.875rem; font-weight: bold; color: #64748b; text-decoration: none; transition: all 0.3s ease;"
    class="hover:text-slate-900"
    onmouseover="this.style.color='#0f172a'"
    onmouseout="this.style.color='#64748b'"
  >
    <div style="display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 50%; background-color: #f1f5f9; transition: background-color 0.3s ease;">
      <svg 
        xmlns="http://www.w3.org/2000/svg" 
        width="16" 
        height="16" 
        viewBox="0 0 24 24" 
        fill="none" 
        stroke="currentColor" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        style="transition: transform 0.3s ease;"
      >
        <path d="m15 18-6-6 6-6"/>
      </svg>
    </div>
    <span style="display: inline-block;">Back</span>
  </a>
</div>

<div class="text-center mb-5">
    <h3 class="fw-bold">Gift Cards & Gaming </h3>
    <p class="text-muted">Near-instant delivery via WhatsApp/SMS</p>
</div>

<div class="row g-4 justify-content-center">
    {% for item in items %}
    <div class="col-6 col-md-4 col-lg-3">
        <a href="/buy/{{ item.link }}" class="text-decoration-none">
            
            <div class="card h-100 shadow-sm border-0 hover-lift overflow-hidden">
                
                <div style="height: 140px; background-color: #f0f0f0;">
                    <img src="{{ item.image }}" alt="{{ item.name }}" 
                         style="width: 100%; height: 100%; object-fit: cover; object-position: center;">
                </div>

                <div class="card-body text-center p-3">
                    <h5 class="fw-bold text-dark mb-1">{{ item.name }}</h5>
                    <p class="text-muted small mb-3">{{ item.desc }}</p>
                    
                    <span class="btn btn-outline-primary btn-sm rounded-pill px-3 w-100">
                        View Prices
                    </span>
                </div>

            </div>
        </a>
    </div>
    {% endfor %}
</div>

<style>
    .hover-lift {
        transition: transform 0.2s;
        cursor: pointer;
    }
    .hover-lift:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 20px rgba(0,0,0,0.15) !important;
    }
</style>

<div style="height: 80px;"></div>

{% endblock %}
