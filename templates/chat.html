{% extends "base.html" %}

{% block title %}Negotiation Vault | DataExpress{% endblock %}

{% block content %}
<script>
    var __firebase_config = '{{ __firebase_config | safe if __firebase_config else "{}" }}';
    var __app_id = '{{ __app_id if __app_id else "ledgehold-ghana1" }}';
</script>

<div class="mb-6">
  <a href="javascript:history.back()" 
    style="display: inline-flex; align-items: center; gap: 12px; padding: 8px 4px; font-size: 0.875rem; font-weight: bold; color: #64748b; text-decoration: none; transition: all 0.3s ease;"
    class="hover:text-slate-900"
  >
    <div style="display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 50%; background-color: #f1f5f9;">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path d="m15 18-6-6 6-6"/>
      </svg>
    </div>
    <span>Back</span>
  </a>
</div>

<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <!-- NOTIFICATION PERMISSION PROMPT -->
        <div id="notifBanner" class="alert bg-primary text-white d-none rounded-4 border-0 shadow-sm mb-3 animate-in">
            <div class="d-flex align-items-center justify-content-between">
                <div class="d-flex align-items-center gap-2">
                    <i class="bi bi-bell-fill"></i>
                    <span class="small fw-bold">Stay updated? Enable vault alerts.</span>
                </div>
                <button onclick="requestNotifPermission()" class="btn btn-light btn-sm rounded-pill fw-bold px-3" style="font-size: 0.7rem;">Enable</button>
            </div>
        </div>

        <div class="card border-0 shadow-sm rounded-4 overflow-hidden mb-4">
            <div class="card-header bg-dark text-white p-3 border-0" style="border-bottom: 3px solid #fbbf24 !important;">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="fw-bold mb-0" id="displaySeller">Merchant Vault</h6>
                        <p class="small mb-0 opacity-75" id="displayItem" style="font-size: 0.7rem;">Initializing Fingerprint...</p>
                    </div>
                    <div class="text-end">
                        <span class="badge bg-success rounded-pill" style="font-size: 0.6rem;" id="vaultStatus">
                            <i class="bi bi-shield-lock-fill"></i> LOG ACTIVE
                        </span>
                    </div>
                </div>
            </div>

            <div id="messages" class="bg-white p-3" style="height: 450px; overflow-y: auto; display: flex; flex-direction: column; gap: 1.25rem;">
                <div id="loadingIndicator" class="text-center my-5">
                    <div class="spinner-border text-primary spinner-border-sm"></div>
                    <p class="small text-muted mt-2">Opening Secure Channel...</p>
                </div>
            </div>

            <div class="card-footer bg-white border-0 p-3">
                <div class="input-group bg-light rounded-pill p-1 shadow-sm border">
                    <input type="text" id="msgInput" class="form-control border-0 bg-transparent px-3" placeholder="Message..." autocomplete="off">
                    <button id="sendBtn" class="btn btn-primary rounded-circle d-flex align-items-center justify-content-center" style="width: 40px; height: 40px;">
                        <i class="bi bi-send-fill"></i>
                    </button>
                </div>
                <div class="text-center mt-3">
                    <p class="mb-0 text-muted fw-bold" style="font-size: 0.6rem; letter-spacing: 0.5px; text-transform: uppercase;">
                        <i class="bi bi-info-circle-fill me-1 text-primary"></i> DPA Compliant
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, query, onSnapshot, serverTimestamp, doc, setDoc } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";

    const msgInput = document.getElementById('msgInput');
    const sendBtn = document.getElementById('sendBtn');
    const messagesContainer = document.getElementById('messages');

    const config = JSON.parse(__firebase_config);
    const app = initializeApp(config);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const appId = __app_id;

    const params = new URLSearchParams(window.location.search);
    const seller = params.get('seller') || 'Merchant';
    const item = params.get('item') || 'Product';
    const itemSlug = item.toLowerCase().replace(/[^a-z0-9]/g, '-');
    
    let sharedVaultId = params.get('vault_id'); 
    let firstLoad = true;
    let lastMsgCount = 0;

    document.getElementById('displaySeller').innerText = seller;
    document.getElementById('displayItem').innerText = item;

    /**
     * PUSH NOTIFICATION SERVICE (ZERO-OPEX BRIDGE)
     */
    window.requestNotifPermission = function() {
        Notification.requestPermission().then(permission => {
            if (permission === "granted") {
                document.getElementById('notifBanner').classList.add('d-none');
                new Notification("Ledgehold Secure Vault", { body: "Notifications enabled for this negotiation." });
            }
        });
    };

    function checkNotifPermission() {
        if (Notification.permission === "default") {
            document.getElementById('notifBanner').classList.remove('d-none');
        }
    }

    onAuthStateChanged(auth, async (u) => {
        if (u) {
            checkNotifPermission();
            if (!sharedVaultId) {
                sharedVaultId = `${u.uid}-${itemSlug}`;
                const newUrl = `${window.location.pathname}?seller=${encodeURIComponent(seller)}&item=${encodeURIComponent(item)}&vault_id=${sharedVaultId}`;
                window.history.replaceState({}, '', newUrl);
            }

            const navRef = doc(db, 'artifacts', appId, 'public', 'data', 'active_negotiations', sharedVaultId);
            await setDoc(navRef, {
                seller: seller,
                item: item,
                buyerId: sharedVaultId,
                lastUpdate: serverTimestamp()
            }, { merge: true });

            startVaultStream(u.uid);
        } else {
            signInAnonymously(auth);
        }
    });

    function startVaultStream(myUid) {
        const msgRef = collection(db, 'artifacts', appId, 'public', 'data', 'negotiations', sharedVaultId, 'messages');
        const q = query(msgRef);

        onSnapshot(q, (snapshot) => {
            if (document.getElementById('loadingIndicator')) document.getElementById('loadingIndicator').remove();
            
            const msgs = [];
            snapshot.forEach(doc => msgs.push(doc.data()));
            msgs.sort((a, b) => (a.timestamp?.seconds || 0) - (b.timestamp?.seconds || 0));

            // NOTIFICATION TRIGGER LOGIC
            if (!firstLoad && msgs.length > lastMsgCount) {
                const latestMsg = msgs[msgs.length - 1];
                // Only notify if the sender isn't the current user and the tab is hidden
                if (latestMsg.senderId !== myUid && document.visibilityState !== 'visible') {
                    new Notification(`New Message: ${seller}`, {
                        body: latestMsg.text,
                        icon: 'https://th.bing.com/th/id/ODF.yDuJDGCntAXV0AebNBqxVQ?w=32&h=32&qlt=90&pcl=fffffc&o=6&pid=1.2'
                    });
                }
            }

            messagesContainer.innerHTML = msgs.length === 0 ? 
                '<div class="text-center py-5 text-muted small">Send a message...</div>' :
                msgs.map(m => {
                    const date = m.timestamp?.toDate();
                    const timeStr = date ? date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '...';
                    const isMe = m.senderId === myUid;
                    return `
                        <div class="d-flex flex-column ${isMe ? 'align-items-end' : 'align-items-start'}">
                            <div class="p-2 px-3 rounded-4 shadow-sm" style="max-width: 85%; font-size: 0.85rem; background: ${isMe ? '#0d6efd' : '#f1f5f9'}; color: ${isMe ? 'white' : '#1e293b'}; border-bottom-${isMe ? 'right' : 'left'}-radius: 4px;">
                                ${m.text}
                            </div>
                            <small class="text-muted mt-1 px-1" style="font-size: 0.6rem; font-weight: 600;">${timeStr}</small>
                        </div>
                    `;
                }).join('');
            
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
            lastMsgCount = msgs.length;
            firstLoad = false;
        });
    }

    async function sendMessage() {
        const text = msgInput.value.trim();
        if (!text || !sharedVaultId) return;

        const msgRef = collection(db, 'artifacts', appId, 'public', 'data', 'negotiations', sharedVaultId, 'messages');
        await addDoc(msgRef, {
            text: text,
            senderId: auth.currentUser.uid,
            timestamp: serverTimestamp()
        });
        msgInput.value = '';
    }

    sendBtn.onclick = sendMessage;
    msgInput.onkeypress = (e) => { if (e.key === 'Enter') sendMessage(); };
</script>

<style>
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .animate-in { animation: fadeInUp 0.4s ease-out; }
</style>
{% endblock %}
